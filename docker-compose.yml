services:
  db:
    image: postgres:16-alpine
    container_name: securecart_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-securecart_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-securecart_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: securecart_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py setup_roles &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,web,0.0.0.0}
      - DB_NAME=${DB_NAME:-securecart_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres_secure_password}
      - DB_HOST=db
      - DB_PORT=5432
      - USE_SQLITE=False
      - AES_SECRET_KEY=${AES_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
